[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-evalkit"
version = "0.1.0.dev0"
description = "Rigorous statistical evaluation for quantum machine learning experiments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Azra Bano" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/azrabano23/qml-evalkit"

[tool.setuptools]
packages = ["qml_evalkit"]
